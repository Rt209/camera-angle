[project]
name = "visual-pose-angle-detector"
version = "0.1.0"
description = "Python CLI and OpenCV toolkit for geometry-based and optical-flow camera pose analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
  "pillow-heif>=0.15.0",
  "rich>=13.0.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
